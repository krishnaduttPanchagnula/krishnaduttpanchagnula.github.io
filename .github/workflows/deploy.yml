name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 1,15 * *" # Run on the 1st and 15th of every month

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for committing new blogs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests html2text

      - name: Sync HackerNoon Blogs
        run: python3 scripts/sync_hackernoon.py

      - name: Commit and Push new blogs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/*.md
          git diff-index --quiet HEAD || git commit -m "chore: sync hackernoon blogs"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
